```yaml
name: AdaptiveVPN Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptivevpn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. دریافت کد پروژه
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. نصب Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. آماده‌سازی Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 4. نصب بسته‌های موردنیاز Android
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # 5. بررسی ساختار پروژه
      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Project files found."

      # 6. تنظیم Gradle
      # چون پروژه در ریشه Gradle Wrapper ندارد،
      # از Gradle نصب‌شده در محیط CI استفاده می‌کنیم.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. بررسی نسخه ابزارها
      - name: Check build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      # 8. اجرای تست‌های واحد
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      # 9. ساخت APK نسخه Debug
      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      # 10. بررسی وجود APK
      - name: Verify APK output
        run: |
          find app/build/outputs/apk/debug -maxdepth 1 \
            -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

      # 11. ذخیره گزارش‌ها در صورت شکست
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptivevpn-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # 12. آپلود APK برای دانلود
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adaptivevpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
```
